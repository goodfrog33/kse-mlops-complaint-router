[project]
name = "complaint-router"
version = "0.1.0"
description = "Routes consumer financial complaints to the right product queue (KSE MLOps course project)."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "polars>=2.0.0",
]

[dependency-groups]
dev = [
    "pre-commit==4.6.2",
    "ruff==0.17.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
