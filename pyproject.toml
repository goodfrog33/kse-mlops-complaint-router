[project]
name = "complaint-router"
version = "0.2.0"
description = "Routes consumer financial complaints to the right product queue (KSE MLOps course project)."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "dvc==3.67.1",
    "dvc-s3==3.3.0",
    "mlflow==3.16.1",
    "pandas>=2.2",
    "polars==2.0.0",
    "psycopg[binary]==3.3.6",
    "scikit-learn==1.9.1",
]

[dependency-groups]
feast = ["feast==0.66.0"]
dev = [
    "pre-commit==4.6.2",
    "pytest>=8.4",
    "ruff==0.17.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/complaint_router"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".repro"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs Postgres and the raw data"]
addopts = "-m 'not integration'"
